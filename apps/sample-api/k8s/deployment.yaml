
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-store
  namespace: sample-api
  labels:
    app.kubernetes.io/name: nova-store
    app.kubernetes.io/component: storefront
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-store
        app.kubernetes.io/component: storefront
    spec:
      containers:
        - name: nova-store
          image: nova-store:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
