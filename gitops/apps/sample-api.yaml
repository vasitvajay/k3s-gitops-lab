
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vasitvajay/k3s-gitops-lab.git
    targetRevision: main
    path: apps/sample-api/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
